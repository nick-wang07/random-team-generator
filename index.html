<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="setup-view" class="view">
      <h1>Team Generator</h1>
      <p id="storage-notice" class="notice" hidden>
        Saving is turned off in this browser, so your roster will not survive a refresh.
      </p>

      <div class="setup-columns">
      <div class="roster-panel">
        <div class="panel-head">
          <h2>Who is in the call?</h2>
          <div class="presence">
            <span id="present-count" class="present-count"></span>
            <button id="select-all-btn" type="button" class="link-btn"></button>
          </div>
        </div>
        <ul id="roster-list" class="roster-list"></ul>
        <p id="removal-notice" class="removal-notice" hidden></p>
        <form id="add-form" class="add-form">
          <input id="name-input" type="text" placeholder="Add a name" autocomplete="off">
          <button id="add-btn" type="submit">Add</button>
        </form>
      </div>

      <div class="config-panel">
        <h2>How are you picking teams?</h2>
        <div class="mode-choice">
          <label class="mode-card">
            <input type="radio" name="pick-mode" value="wheel" checked>
            <span class="mode-card-face">
              <span class="mode-title">Wheel</span>
              <span class="mode-desc">Spin for one name at a time. Teams fill in turn.</span>
            </span>
          </label>
          <label class="mode-card">
            <input type="radio" name="pick-mode" value="draft">
            <span class="mode-card-face">
              <span class="mode-title">Captain draft</span>
              <span class="mode-desc">Captains take turns picking their teammates.</span>
            </span>
          </label>
        </div>

        <div class="field-row">
          <label for="team-count">Teams</label>
          <input id="team-count" type="number" min="2" max="8" value="2">
        </div>

        <div id="draft-config" hidden>
          <fieldset class="draft-options">
            <legend>Pick order</legend>
            <label><input type="radio" name="draft-order" value="snake" checked> Snake (A B B A)</label>
            <label><input type="radio" name="draft-order" value="alternating"> Alternating (A B A B)</label>
          </fieldset>
          <fieldset class="draft-options">
            <legend>Captains</legend>
            <label><input type="radio" name="captain-mode" value="spin" checked> Spin for them</label>
            <label><input type="radio" name="captain-mode" value="choose"> Choose them</label>
            <ul id="captain-list" class="roster-list" hidden></ul>
          </fieldset>
        </div>

        <p id="split-preview" class="split-preview"></p>
        <p id="setup-error" class="error" hidden></p>
        <div class="start-buttons">
          <button id="start-wheel-btn" type="button">Spin the wheel</button>
          <button id="start-draft-btn" type="button" hidden>Start the draft</button>
        </div>
      </div>
      </div>
    </section>

    <section id="run-view" class="view" hidden>
      <h2 id="turn-heading" class="turn-heading"></h2>
      <div class="run-stage">
        <div id="run-teams-left" class="team-side"></div>
        <div class="wheel-wrap">
          <canvas id="wheel-canvas" width="600" height="600"></canvas>
        </div>
        <div id="run-teams-right" class="team-side"></div>
      </div>
      <div id="run-controls" class="start-buttons"></div>
    </section>

    <!-- Lives outside every view section on purpose: the last captain spin
         hides #run-view as it routes to the draft board, and anything inside
         it would be hidden along with it before it could be read. -->
    <div id="reveal-overlay" class="reveal-overlay" hidden>
      <div id="reveal-card" class="reveal-card" role="status" aria-live="polite">
        <button type="button" id="reveal-close" class="reveal-close" aria-label="Close">&times;</button>
        <p id="reveal-name" class="reveal-name"></p>
        <p id="reveal-team" class="reveal-team"></p>
      </div>
    </div>
    <section id="draft-view" class="view" hidden>
      <h2 id="draft-heading" class="turn-heading"></h2>
      <div id="draft-order-strip" class="order-strip"></div>
      <div class="run-stage">
        <div id="draft-teams-left" class="team-side"></div>
        <div id="draft-pool" class="draft-pool"></div>
        <div id="draft-teams-right" class="team-side"></div>
      </div>
      <div id="draft-controls" class="start-buttons"></div>
    </section>
    <section id="results-view" class="view" hidden></section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
